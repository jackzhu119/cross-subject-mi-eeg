[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-subject-mi-eeg"
version = "0.1.0"
description = "Reproducible research project for cross-subject motor imagery EEG decoding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9,<4",
  "mne>=1.10,<2",
  "moabb>=1.4,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

