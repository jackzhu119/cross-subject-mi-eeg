   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #176a9a" x="244.8" y="35.188594" transform="rotate(-0 244.8 35.188594)">A   Frozen source configurations</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(168.270094 46.276425)">S9: 9 BNCI participants / 2,592 trials</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(144.174563 56.959125)">S29: BNCI + 20 Yang participants / 14,590 trials</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(144.174563 67.641825)">S60: BNCI + 51 Yang participants / 33,183 trials</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #176a9a" x="244.8" y="114.276094" transform="rotate(-0 244.8 114.276094)">B   One dimensionless processing recipe</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(95.492625 125.327175)">18 common channels · common-average reference · 160 Hz · 2-s crops</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(135.375563 136.083375)">BROAD: 8–30 Hz     Shared: μ 8–13 Hz + β 13–30 Hz</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(99.072469 146.766075)">Per-channel temporal centering; common within-trial broadband RMS</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #176a9a" x="126.1944" y="193.363594" transform="rotate(-0 126.1944 193.363594)">C   Source-only selection</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(52.032244 204.881325)">5 whole-participant validation folds</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(51.205369 215.564025)">3 validation seeds → 90 trajectories</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(50.481525 226.246725)">8 frozen rules → 48 selected epochs</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(48.378244 236.929425)">Equal dataset / participant weighting</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #176a9a" x="363.4056" y="193.363594" transform="rotate(-0 363.4056 193.363594)">D   Final source training</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(300.047287 204.881325)">3 final seeds → 18 trajectories</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(279.135881 215.564025)">40 epochs × 128 updates per trajectory</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(285.902475 226.246725)">50:50 BNCI:Yang sampling (S29/S60)</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(285.266569 236.929425)">144 outputs / 99 distinct checkpoints</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #176a9a" x="244.8" y="283.993594" transform="rotate(-0 244.8 283.993594)">E   Frozen external scoring · exploratory Dreyer evaluation</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(144.037406 300.641325)">85 participants × 80 trials = 6,800 unique trials</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(136.611281 311.324025)">Event/class metadata: eligibility and class mapping</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(99.445219 322.006725)">Ground-truth labels: scoring only; no target fitting or model selection</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(84.321937 332.689425)">Per-seed class recalls → within-participant seed averages → paired inference</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #59616b" x="244.8" y="384.883594" transform="rotate(-0 244.8 384.883594)">F   Evidence checks with defined scope</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(112.228313 399.177675)">Source identities / contracts / checkpoint and selector bindings</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(111.252469 409.860375)">Saved predictions → participant metrics → four frozen contrasts</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #20262c" transform="translate(94.842281 420.543075)">1,179 external arithmetic checks passed; no checkpoint-forward replay</text>
   </g>
