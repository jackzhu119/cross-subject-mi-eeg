[project]
name = "paper1-source-expansion"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.8.0+cu128",
  "torchaudio==2.8.0+cu128",
  "braindecode==1.5.1",
  "numpy==2.3.5",
  "scipy==1.17.0",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "mne==1.13.2",
  "h5py==3.16.0",
  "skorch==1.4.0",
  "einops==0.8.2",
  "matplotlib==3.10.8",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
